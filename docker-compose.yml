# Medical Causation AI — infrastructure Compose
# Production on the droplet and local Node development both use this file.
# It starts PostgreSQL and Redis only. The API and web run on the host
# (PM2 in production, npm run dev:* locally).
#
#   docker compose up -d postgres redis
#
# pgAdmin is optional and listens on localhost. Start it by name:
#   docker compose up -d pgadmin
#
# Development Docker Compose is for local development only:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: medical-causation-ai

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mca-network

  redis:
    image: redis:7-alpine
    container_name: mca-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mca-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mca-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mca-network

  # Optional local inbox. Start with: docker compose --profile mail up -d mailpit
  mailpit:
    image: axllent/mailpit:latest
    container_name: mca-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - mca-network

  # HTTPS for the website and API (Let's Encrypt). Needs APP_DOMAIN, API_DOMAIN
  # and ACME_EMAIL in .env and DNS for both names. See DEPLOYMENT.md, "HTTPS".
  # Start with: docker compose --profile https up -d caddy
  caddy:
    image: caddy:2-alpine
    container_name: mca-caddy
    profiles: ["https"]
    restart: unless-stopped
    # Host networking: Caddy listens on ports 80 and 443 and reaches the PM2
    # apps on 127.0.0.1:3000 and 127.0.0.1:3001.
    network_mode: host
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional free local embeddings/chat. Start with: docker compose --profile local-ai up -d ollama
  ollama:
    image: ollama/ollama:latest
    container_name: mca-ollama
    profiles: ["local-ai"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mca-network

networks:
  mca-network:
    driver: bridge
    name: mca-network

volumes:
  postgres_data:
    name: mca-postgres-data
  redis_data:
    name: mca-redis-data
  pgadmin_data:
    name: mca-pgadmin-data
  ollama_data:
    name: mca-ollama-data
  # Certificates and ACME account. Keep it, or Let's Encrypt rate limits apply.
  caddy_data:
    name: mca-caddy-data
  caddy_config:
    name: mca-caddy-config
