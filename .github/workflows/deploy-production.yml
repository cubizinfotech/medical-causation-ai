# Push to main deploys the droplet over SSH.
# The server runs scripts/deploy-production.sh (PM2 for the apps, Docker for Postgres and Redis).
# This workflow does not build or push application images.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     droplet IP or hostname
#   DEPLOY_USER     SSH user (the existing deploy user)
#   DEPLOY_SSH_KEY  private key, pasted with its line breaks
# Do not store the production .env or passwords in GitHub.

name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Set GitHub Actions secrets DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'if [ -d /var/www/medical-causation-ai/.git ]; then export MCA_ROOT=/var/www/medical-causation-ai; elif [ -d "$HOME/medical-causation-ai/.git" ]; then export MCA_ROOT="$HOME/medical-causation-ai"; else echo "Clone the repository to /var/www/medical-causation-ai"; exit 1; fi; bash "$MCA_ROOT/scripts/deploy-production.sh"'
