# Development Docker Compose is for local development only.
# It is not the production deployment. Production runs the API and web with PM2.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# These containers use the Compose hostnames postgres and redis.
# A process on the host (npm run dev:api, PM2) uses 127.0.0.1 instead.

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    container_name: mca-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_BASE_PATH: /knowledge-base
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/package.json:/app/apps/api/package.json:ro
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./apps/api/tsconfig.build.json:/app/apps/api/tsconfig.build.json:ro
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json:ro
      - ./knowledge-base:/knowledge-base:ro
    ports:
      - "${API_PORT:-3001}:3001"
    command: npm run start:dev --workspace=api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mca-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: mca-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/package.json:/app/apps/web/package.json:ro
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
      - ./apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs:ro
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: npm run dev --workspace=web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mca-network
