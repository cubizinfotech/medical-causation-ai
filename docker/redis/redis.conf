# Medical Causation AI — Redis configuration
# Prepared for caching, BullMQ queues, AI task processing, and session cache.

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
supervised no
loglevel notice

# Persistence — AOF for durability of queue state
appendonly yes
appendfsync everysec
dir /data

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Connection settings
timeout 0
tcp-keepalive 300

# Key naming conventions (documentation only — enforced in application code):
#   cache:*       — general application cache
#   session:*     — user session data (future)
#   bull:*        — BullMQ queue keys (future)
#   ai:task:*     — AI processing task state (future)
