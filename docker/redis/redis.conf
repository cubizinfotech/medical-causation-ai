# Medical Causation AI — Redis configuration
# Prepared for caching, BullMQ queues, AI task processing, and session cache.

# Network
# Bind inside the container so Docker can forward the published port.
# The host publishes that port on 127.0.0.1 only (see docker-compose.yml),
# and docker-compose.yml adds --requirepass when REDIS_PASSWORD is set.
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
supervised no
loglevel notice

# Persistence — AOF for durability of queue state
appendonly yes
appendfsync everysec
dir /data

# Memory management
# BullMQ keeps job and lock state in Redis and requires noeviction: with an
# LRU policy Redis may silently delete queued jobs when memory is full.
# Application cache keys carry their own TTL (REDIS_TTL_SECONDS).
maxmemory 256mb
maxmemory-policy noeviction

# Connection settings
timeout 0
tcp-keepalive 300

# Keys written by the API:
#   mca:analysis:job:*                — MCA job progress (expires)
#   mca:ewi:investigation:job:*       — EWI job progress (expires)
#   mca:auth:revoked:*                — signed-out tokens until they expire
#   {mca-bull}:* and {ewi-bull}:*     — BullMQ queues
