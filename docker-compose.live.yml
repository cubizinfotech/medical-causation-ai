# Live droplet overrides (IP-based deploy, no domain yet).
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.live.yml up -d --build
#
# Keeps Postgres/Redis on localhost only. Does not start pgAdmin, Mailpit, or Ollama.
# Publish only web (3000) and API (3001) for IP access. Prefer a DigitalOcean firewall.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  pgadmin:
    profiles: ["tools"]

  api:
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      # Containers must use Docker DNS names, not the public IP or 127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: production

  web:
    ports:
      - "${WEB_PORT:-3000}:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
